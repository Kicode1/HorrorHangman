<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#080506">
    <title>HANGMAN — Some Words Should Stay Buried</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>

<body>
    <div class="background-art" aria-hidden="true"></div>
    <div class="scanlines" aria-hidden="true"></div>
    <div class="vignette" aria-hidden="true"></div>

    <main class="game">
        <header class="header">
            <p class="eyebrow">UNKNOWN SIGNAL // 03:17 AM</p>
            <h1>HANGMAN</h1>
            <p class="subtitle">Some words should stay buried...</p>
            <div class="signal"><span></span> CONNECTION UNSTABLE</div>
        </header>

        <section class="game-layout">
            <div class="drawing-panel">
                <p class="section-label">SUBJECT STATUS</p>

                <svg id="hangman-drawing" viewBox="0 0 240 260" role="img" aria-label="Hangman drawing">
                    <g class="gallows">
                        <line x1="25" y1="235" x2="145" y2="235" />
                        <line x1="55" y1="235" x2="55" y2="20" />
                        <line x1="55" y1="20" x2="155" y2="20" />
                        <line x1="155" y1="20" x2="155" y2="48" />
                    </g>
                    <g class="person">
                        <circle class="part" data-part="1" cx="155" cy="68" r="20" />
                        <line class="part" data-part="2" x1="155" y1="88" x2="155" y2="150" />
                        <line class="part" data-part="3" x1="155" y1="105" x2="125" y2="130" />
                        <line class="part" data-part="4" x1="155" y1="105" x2="185" y2="130" />
                        <line class="part" data-part="5" x1="155" y1="150" x2="128" y2="190" />
                        <line class="part" data-part="6" x1="155" y1="150" x2="182" y2="190" />
                    </g>
                </svg>

                <div class="status-box">
                    <span>MISTAKES</span>
                    <strong><span id="mistakes">0</span><span class="muted"> / 6</span></strong>
                </div>
                <p class="warning">DO NOT LET IT FIND YOU.</p>
            </div>

            <div class="play-panel">
                <p class="section-label">RECOVERED WORD</p>
                <div id="word" class="word" aria-label="Hidden word"></div>

                <div class="hint-box">
                    <span class="hint-label">TRANSMISSION / HINT</span>
                    <p id="hint">Receiving signal...</p>
                </div>

                <p id="message" class="message" aria-live="polite">
                    The connection is open. Choose a letter.
                </p>

                <div id="keyboard" class="keyboard" aria-label="Letter choices"></div>

                <button id="new-game" class="new-game">⟲ &nbsp; NEW GAME</button>
            </div>
        </section>

        <footer>
            <span>FILE 006</span>
            <span>THE SIGNAL IS WATCHING</span>
            <span id="clock">SIGNAL ACTIVE</span>
        </footer>
    </main>
</body>

</html>
